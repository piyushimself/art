name: Audit Art Library

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'tools/audit_site.py'
      - '.github/workflows/site-audit.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'tools/audit_site.py'
      - '.github/workflows/site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: art-library-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit every HTML page and JavaScript block
        run: python tools/audit_site.py

<title>Meal Picker</title><style>
:root{--bg:#fbf6ee;--fg:#1f2320;--card:#fff;--mut:#6b6f6a;--bd:#eadfcf;--ac:#2f7d4b}
@media(prefers-color-scheme:dark){:root{--bg:#141714;--fg:#f0f0ea;--card:#212621;--mut:#a5aaa3;--bd:#363c36;--ac:#5fbf83}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
.w{max-width:600px;margin:auto;padding:0 14px 96px}h1{margin:16px 0 0;font-size:22px}.sub{color:var(--mut);font-size:13px}
.prog{display:flex;gap:6px;margin:12px 0 8px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.prog i.on{background:var(--ac)}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.trail button,.chips button{border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:5px 12px;font-size:13px}
h2{font-size:21px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.big{border:0;border-radius:18px;min-height:88px;font-size:19px;font-weight:700;color:#1f2320;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.big small{font-weight:500;font-size:12px;opacity:.8;margin-top:2px}.big span{font-size:26px}
.tile{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 10px 10px 16px;cursor:pointer;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile:active,.big:active{transform:scale(.97)}.band{position:absolute;left:0;top:0;bottom:0;width:6px}
.tile b{display:block;font-size:15px}.pair{font-size:11px;color:var(--mut);margin:2px 0 6px}.nums{font-size:13px;font-weight:700}
.bar{height:5px;border-radius:3px;background:var(--bd);margin:6px 0}.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.rec{font-size:12px;border:1px solid var(--bd);background:none;color:var(--fg);border-radius:12px;padding:3px 10px}
.base{background:#fff3b0;color:#3a3200;border-color:#e6d46a}.base .pair{color:#5a5000}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px}.chips button{flex:none}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lbl{font-size:12px;color:var(--mut);margin:2px 0 4px}.day{margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}.sum .hd{padding:14px;color:#fff;font-size:18px;font-weight:700}
.row{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px;align-items:center}.row small{color:var(--mut);display:block}
.tot{padding:16px;text-align:center;font-size:26px;font-weight:800}.tot small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.btn{padding:13px 18px;border-radius:12px;border:0;font-weight:700;font-size:15px}.pri{background:var(--ac);color:#fff}.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.bot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;justify-content:center}.bot .btn{flex:1;max-width:280px}
dialog{width:min(560px,94vw);max-height:88vh;border:0;border-radius:14px;background:var(--card);color:var(--fg);padding:0}dialog::backdrop{background:rgba(0,0,0,.5)}
.in{padding:16px}.in h2{margin:0 0 6px}.in span{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;background:rgba(128,128,128,.18);margin:0 4px 4px 0}
.in h4{margin:14px 0 4px}.in ul,.in ol{margin:0;padding-left:20px}.in li{margin:3px 0}.tip{font-style:italic;color:var(--mut);margin-top:10px}
.yt{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:10px;background:#c4302b;color:#fff;text-decoration:none;font-weight:600}.x{float:right;border:0;background:none;color:var(--fg);font-size:26px;line-height:1}
.bd{font-style:normal;font-size:10px;font-weight:700;color:#fff;padding:1px 7px;border-radius:9px;margin-right:2px}
.chips button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--ac));margin-right:6px}
.chips .on{background:var(--c,var(--ac));color:#fff;border-color:var(--c,var(--ac))}.chips .on::before{background:#fff}
#qs{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-size:15px;margin-bottom:8px}
.bot{gap:4px;padding:6px 10px}.nv{flex:1;border:0;background:none;color:var(--mut);font-size:20px;padding:4px 0;border-radius:10px}
.nv small{display:block;font-size:11px}.nv.on{color:var(--ac);font-weight:700;background:rgba(128,128,128,.16)}
.nutri{display:flex;gap:10px;margin:10px 0 2px;padding:10px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.nutri div{text-align:center;flex:1}.nutri b{display:block;font-size:16px}
.nutri i{font-style:normal;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.benefit{margin:10px 0;font-size:13px;color:var(--fg);background:rgba(47,125,75,.14);border-radius:10px;padding:8px 10px}

<div class="lbl">Sort</div><div class="chips">${[["def","Default"],["pro","Most protein"],["kcal","Lightest"]].map(o=>`<button class="${st.o==o[0]?"on":""}" data-o="${o[0]}">${o[1]}</button>`).join("")}</div>
<div class="grid"><div class="tile base full" data-m="BASE"><b>Base plan meal</b><div class="pair">${e(b[0])}</div><div class="nums">~${b[1]} kcal &middot; ~${b[2]} g protein</div></div>`+L.map(x=>tile(x,"data-m")).join("")+`</div>`}
if(n==4){const S=PL[0][sideK(st.s)];h=`<h2>Pick a hung curd side</h2><div class="sub" style="margin-bottom:10px">Replaces plain curd. Each is about 75 kcal and 9 g protein per 100 g.</div><div class="grid"><div class="tile full" data-sd="PLAIN"><b>Plain curd 100 g</b><div class="pair">As in your base plan</div></div>`+S.map(x=>tile(x,"data-sd")).join("")+`</div>`}
if(n==5){picks[st.d][st.s]={m:st.m,sd:st.sd};const mm=mi(st.s);let r,k,g;
if(st.m=="BASE"){const b=PL[st.d].base[st.s];k=b[1];g=b[2];r=`<div class="row"><div><b>Base plan meal</b><small>${e(b[0])}</small></div></div>`}
else{const x=opt(st.s,st.m);k=x[2];g=x[3];r=`<div class="row"><div><b>${e(D[st.m].t)}</b><small>${e(D[st.m].src)} &middot; ${e(D[st.m].time)}</small></div><button class="rec" data-r="${st.m}">Recipe &amp; video</button></div><div class="row"><div><b>Eat it with</b><small>${e(x[1].replace(/^\+ /,""))}</small></div></div>`;
if(st.sd&&st.sd!="PLAIN")r+=`<div class="row"><div><b>${e(D[st.sd].t)}</b><small>Hung curd side, 100 g</small></div><button class="rec" data-r="${st.sd}">Recipe &amp; video</button></div>`;
else if(st.sd=="PLAIN")r+=`<div class="row"><div><b>Plain curd</b><small>100 g</small></div></div>`}
h=`<h2>Your meal</h2><div class="sum"><div class="hd" style="background:${mm[3]}">${mm[2]} ${mm[1]} &middot; ${DAYS[st.d]}</div>${r}<div class="tot">~${k} kcal &middot; ~${g} g protein<small>Full meal with pairing. Target ${mm[4]}.</small></div></div>
<div class="acts"><button class="btn pri" data-go="2">Pick another meal</button><button class="btn sec" data-go="3">Change dish</button></div>`}
$("app").innerHTML=h;}

let view="home";const nb=()=>({s:"all",m:"all",g:"all",o:"def",q:""});let br=nb();
const IC={HC:"\u{1F963}",MW:"\u26A1",AF:"\u{1F35F}",CZ:"\u{1F9C0}",SW:"\u{1F96A}",DG:"\u{1F35A}",SM:"\u{1F964}",SS:"\u{1F957}",SY:"\u{1F95B}",CF:"\u{2615}",CP:"\u{1F95C}",CM:"\u{1F36B}",BR:"\u{1F35E}",EG:"\u{1F95A}",SC:"\u{1FAD8}"},CNT={};Object.keys(DI).forEach(k=>{const s=k.slice(0,2);CNT[s]=(CNT[s]||0)+1});
const GR={HC:[["Chocolate & dessert","#6B3A2A"],["Indian mithai","#A6741A"],["Nut & seed","#2F7D4B"],["Savoury & dips","#C2185B"],["International","#1E5FA8"],["New additions","#6d28d9"]],
CZ:[["Indian classic","#B5411F"],["Quick meals & bowls","#2F7D4B"],["Snacks & bites","#D9541E"],["Salads & spreads","#C2185B"],["Global","#1E5FA8"],["New additions","#6d28d9"]]};
function render(){document.querySelectorAll(".nv").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
$("pg").style.display=$("tr").style.display=view=="plan"?"":"none";
if(view=="plan")plan();else if(view=="browse")browse();else home();window.scrollTo(0,0)}
function home(){$("app").innerHTML=`<h2>What would you like to do?</h2><div class="grid">
<button class="big" style="background:#2f7d4b;color:#fff" data-v="plan"><span>&#128197;</span>Plan a meal<small>Day, meal, dish, side</small></button>
<button class="big" style="background:#1e5fa8;color:#fff" data-bs="all"><span>&#128269;</span>Browse all<small>${Object.keys(DI).length} dishes</small></button></div>
<h2 style="margin-top:22px">Browse by type</h2><div class="grid">`+Object.keys(SN).map(k=>`<button class="big" style="background:${COL[k]};color:#fff" data-bs="${k}"><span>${IC[k]}</span>${SN[k]}<small>${CNT[k]} dishes</small></button>`).join("")+`</div>
<h2 style="margin-top:22px">Browse by meal</h2><div class="grid">`+M.map(m=>`<button class="big" style="background:${m[3]};color:#fff" data-bm="${m[0]}"><span>${m[2]}</span>${m[1]}</button>`).join("")+`</div>`}
function browse(){const b=br,ch=(a,v,l,c,cur)=>`<button class="${cur==v?"on":""}" style="--c:${c}" data-${a}="${v}">${l}</button>`;
let h=`<h2>Browse recipes</h2><input id="qs" type="search" placeholder="Search by dish, ingredient or keyword..." value="${e(b.q)}"><div class="lbl">Type</div><div class="chips">${ch("bs","all","All 150","#555",b.s)}${Object.keys(SN).map(k=>ch("bs",k,SN[k]+" "+CNT[k],COL[k],b.s)).join("")}</div>
<div class="lbl">Meal</div><div class="chips">${ch("bm","all","Any meal","#555",b.m)}${M.map(m=>ch("bm",m[0],m[2]+" "+m[1],m[3],b.m)).join("")}${ch("bm","X","Sides","#d98e04",b.m)}</div>`;
if(GR[b.s])h+=`<div class="lbl">Group</div><div class="chips">${ch("bg","all","All groups","#555",b.g)}${GR[b.s].map((g,i)=>ch("bg",i,g[0],g[1],b.g)).join("")}</div>`;
h+=`<div class="lbl">Sort</div><div class="chips">${[["def","Default"],["pro","Most protein"],["kcal","Lightest"]].map(o=>ch("bo",o[0],o[1],"#555",b.o)).join("")}</div><div class="lbl" id="cnt"></div><div class="grid" id="bres"></div>`;
$("app").innerHTML=h;results()}
function results(){const b=br,q=b.q.trim().toLowerCase(),qt=q.split(/\s+/).filter(Boolean);
let L=Object.keys(DI).filter(k=>{const x=DI[k],d=D[k],hay=(d.t+" "+d.src+" "+(d.ing||[]).join(" ")+" "+(d.benefit||"")).toLowerCase();return(b.s=="all"||k.startsWith(b.s))&&(b.m=="all"||(b.m=="X"?x[0].length==2:x[0]==b.m))&&(b.g=="all"||x[1]==+b.g)&&(!qt.length||qt.every(t=>hay.includes(t)))});
if(b.o=="pro")L.sort((a,c)=>DI[c][3]-DI[a][3]);else if(b.o=="kcal")L.sort((a,c)=>DI[a][2]-DI[c][2]);
$("cnt").textContent=L.length+" dishes. Tap one for the recipe and video."+(b.s=="HC"||b.s=="all"?" Hung curd numbers are per 200 g.":"");
$("bres").innerHTML=L.map(k=>{const x=DI[k],s=k.slice(0,2),m=x[0].length==2?["X","Side","","#d98e04"]:mi(x[0]);
return `<div class="tile" data-r="${k}"><i class="band" style="background:${COL[s]}"></i><b>${e(D[k].t)}</b><div class="pair"><em class="bd" style="background:${COL[s]}">${SN[s]}</em><em class="bd" style="background:${m[3]}">${m[1]}</em></div><div class="nums">~${x[2]} kcal &middot; ~${x[3]} g</div><div class="bar"><i style="width:${Math.min(100,x[3]/40*100)}%"></i></div></div>`}).join("")||`<div class="sub full">No dishes match.</div>`}
document.addEventListener("input",ev=>{if(ev.target.id=="qs"){br.q=ev.target.value;results()}});
function recipe(t){const d=D[t];$("dc").innerHTML=`<button class="x" onclick="$('dg').close()">&times;</button><h2 style="border-left:6px solid ${COL[t.slice(0,2)]};padding-left:8px">${e(d.t)}</h2><span style="background:${COL[t.slice(0,2)]};color:#fff">${d.src}</span><span>${e(d.time)}</span><div class="nutri"><div><b>~${d.kcal}</b><i>kcal</i></div><div><b>~${d.prot} g</b><i>protein</i></div><div><b>~${d.fib} g</b><i>fibre</i></div></div><div class="benefit">\u{1F331} ${e(d.benefit)}</div>
<h4>Ingredients${d.note?` <small>(${d.note})</small>`:""}</h4><ul>${d.ing.map(i=>`<li>${e(i)}</li>`).join("")}</ul><h4>Process</h4><ol>${d.steps.map(i=>`<li>${e(i)}</li>`).join("")}</ol>${d.tip?`<div class="tip">Tip: ${e(d.tip)}</div>`:""}
<a class="yt" href="${d.yt}" target="_blank" rel="noopener">Watch on YouTube</a>`;$("dg").showModal()}
document.addEventListener("click",ev=>{const g=k=>ev.target.closest("["+k+"]");let el;
if(el=g("data-r"))return recipe(el.dataset.r);
if(el=g("data-d")){go(1);st.d=+el.dataset.d}
else if(el=g("data-s")){go(2);st.s=el.dataset.s}
else if(el=g("data-m")){go(3);st.m=el.dataset.m}
else if(el=g("data-sd")){st.sd=el.dataset.sd}
else if(el=g("data-f"))st.f=el.dataset.f;
else if(el=g("data-o"))st.o=el.dataset.o;
else if(el=g("data-go")){const d=st.d,s=st.s;go(+el.dataset.go);if(+el.dataset.go>=2)st.d=d;if(+el.dataset.go>=3)st.s=s}
else if(g("data-back")){const n=step(),d=st.d,s=st.s,to=(n==5&&!(need()&&st.m!="BASE"))?3:n-1;go(to);if(to>=2)st.d=d;if(to>=3)st.s=s}
else if(g("data-reset")){go(1)}
else if(el=g("data-v")){view=el.dataset.v}
else if(el=g("data-bs")){if(view=="home")br=nb();br.s=el.dataset.bs;br.g="all";view="browse"}
else if(el=g("data-bm")){if(view=="home")br=nb();br.m=el.dataset.bm;view="browse"}
else if(el=g("data-bg"))br.g=el.dataset.bg;
else if(el=g("data-bo"))br.o=el.dataset.bo;
else if(ev.target==$("dg")){$("dg").close();return}else return;
render()});
render();
</script><script src="assets/js/library.js" defer></script></body></html>
